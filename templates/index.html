{% extends "base.html" %}
{% block content %}
<section class="hero rounded-4 p-4 p-md-5 mb-4">
  <h1 class="display-6 fw-bold">Acoustic + Vibration (4-Channel)</h1>
  <p class="lead mb-0">Upload CSVs. We'll compute <b>Morlet CWT</b> scalograms and let you preview them <b>before</b> running predictions.</p>
</section>

<form method="post" enctype="multipart/form-data" class="card border-0 shadow-lg rounded-4 overflow-hidden">
  <div class="card-body p-4 p-md-5">
    <div class="row g-4">
      <div class="col-md-6">
        <label class="form-label">Acoustic CSV (must have <code>values</code> column)</label>
        <input class="form-control" type="file" name="acoustic_file" accept=".csv">
      </div>
      <div class="col-md-6">
        <label class="form-label">Vibration CSV (<code>x/y A/B</code> columns)</label>
        <input class="form-control" type="file" name="vibration_file" accept=".csv">
      </div>
    </div>
    <div class="d-flex gap-3 mt-4">
      <button class="btn btn-primary btn-lg" type="submit">Generate Scalograms</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('index') }}">Reset</a>
    </div>
    <div class="form-text mt-3">We’ll only render scalograms at this stage. No model inference yet.</div>
  </div>
</form>
{% endblock %}
